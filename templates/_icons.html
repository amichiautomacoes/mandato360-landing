{# Ícones locais com o mesmo traço, sem fontes ou bibliotecas externas. #}
{% macro icon(name, size=24) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  {% if name == 'raiox' %}
  <path d="M20 10c0 6-8 11-8 11S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>
  {% elif name == 'dna' %}
  <path d="M7 3c0 8 10 10 10 18M17 3c0 8-10 10-10 18M7.5 5h9M9.5 9h5M9.5 15h5M7.5 19h9"/>
  {% elif name == 'dre' %}
  <path d="M4 3v17h17M8 15v-4M13 15V6M18 15V9"/>
  {% elif name == 'impacto' %}
  <path d="m3 8 9-5 9 5H3ZM5 11v7M10 11v7M14 11v7M19 11v7M3 21h18"/>
  {% elif name == 'arrow-right' %}
  <path d="M4 12h16m-6-6 6 6-6 6"/>
  {% elif name == 'arrow-left' %}
  <path d="M20 12H4m6-6-6 6 6 6"/>
  {% elif name == 'arrow-down' %}
  <path d="M12 4v16m-6-6 6 6 6-6"/>
  {% elif name == 'external' %}
  <path d="M6 18 18 6M6 6h12v12"/>
  {% elif name == 'pause' %}
  <path d="M9 5v14M15 5v14"/>
  {% elif name == 'play' %}
  <path d="m8 5 11 7-11 7V5Z"/>
  {% elif name == 'check' %}
  <path d="m5 12 4 4L19 6"/>
  {% elif name == 'close' %}
  <path d="m6 6 12 12M18 6 6 18"/>
  {% endif %}
</svg>
{%- endmacro %}
